name: Publish NuGet Package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore workloads
      run: dotnet workload restore --source https://api.nuget.org/v3/index.json src/MH.UI.Android/MH.UI.Android.csproj

    - name: Restore dependencies
      run: dotnet restore src/MH.UI.Android/MH.UI.Android.csproj
      
    - name: Build
      run: dotnet build src/MH.UI.Android/MH.UI.Android.csproj --configuration Release
    
    - name: Pack
      run: dotnet pack src/MH.UI.Android/MH.UI.Android.csproj --configuration Release --output .
    
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to NuGet
      run: dotnet nuget push *.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
